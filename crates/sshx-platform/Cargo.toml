[package]
name = "sshx-platform"
description = "SSHX Platform: multi-user web platform for persistent sshx terminals and AI agents."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.86"
async-stream = "0.3.5"
axum = { version = "0.8.1", features = ["ws", "json", "macros"] }
base64 = "0.22"
clap = { version = "4.5.17", features = ["derive", "env"] }
futures-util = { version = "0.3.30", features = ["sink"] }
jsonwebtoken = "9.3"
rand = "0.8.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0.188", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.8"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1.40", features = ["full"] }
tokio-stream = { version = "0.1.15", features = ["sync"] }
tokio-tungstenite = { version = "0.26.1", features = ["rustls-tls-webpki-roots"] }
tower-http = { version = "0.6.2", features = ["fs", "trace"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
url = "2.5"

[dev-dependencies]
tempfile = "3"
