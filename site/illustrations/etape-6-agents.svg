<defs></defs>
<rect id="fond" width="1600" height="900" fill="#FFFFFF"/>
<g id="application"><path d="M50 112 V78 a18 18 0 0 1 18 -18 H1222 a18 18 0 0 1 18 18 V112 Z" fill="#F4F4F5"/><path d="M50 112 H1240 V822 a18 18 0 0 1 -18 18 H68 a18 18 0 0 1 -18 -18 Z" fill="#09090B"/><circle cx="78" cy="86" r="7" fill="#D4D4D8"/><circle cx="100" cy="86" r="7" fill="#D4D4D8"/><circle cx="122" cy="86" r="7" fill="#D4D4D8"/><rect x="154" y="70" width="356.2" height="32" rx="16" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1.5"/><text x="174" y="92" font-size="17" font-weight="400" fill="#52525B" class="mono" xml:space="preserve">plateforme.votre-tailnet.ts.net</text><rect x="50" y="60" width="1190" height="780" rx="18" fill="none" stroke="#D4D4D8" stroke-width="2"/><rect x="51" y="112" width="370" height="727" fill="#18181B"/><path d="M51 760 H421 V822 a17 17 0 0 1 -17 17 H68 a17 17 0 0 1 -17 -17 Z" fill="#18181B"/><line x1="421" y1="112" x2="421" y2="839" stroke="#27272A" stroke-width="2"/><rect x="70" y="130" width="332" height="44" rx="8" fill="#09090B" stroke="#3F3F46" stroke-width="1.5"/><text x="88" y="159" font-size="17" font-weight="400" fill="#71717A">Filtrer…</text><text x="78" y="220" font-size="16" font-weight="700" fill="#71717A">SITE-WEB</text><rect x="64" y="234" width="344" height="50" rx="8" fill="#27272A" stroke="none" stroke-width="2"/><circle cx="82" cy="258" r="7" fill="#FBBF24"/><text x="100" y="264" font-size="19" font-weight="600" fill="#F4F4F5">page d’accueil</text><text x="396" y="264" font-size="17" font-weight="600" fill="#FBBF24" text-anchor="end">question</text><circle cx="82" cy="312" r="7" fill="#52525B"/><text x="100" y="318" font-size="19" font-weight="400" fill="#E4E4E7">serveur de dev</text><text x="78" y="386" font-size="16" font-weight="700" fill="#71717A">APP-INTERNE</text><circle cx="82" cy="424" r="7" fill="#818CF8"/><text x="100" y="430" font-size="19" font-weight="400" fill="#E4E4E7">tests API</text><text x="396" y="430" font-size="17" font-weight="600" fill="#818CF8" text-anchor="end">au travail</text><circle cx="82" cy="478" r="7" fill="#34D399"/><text x="100" y="484" font-size="19" font-weight="400" fill="#E4E4E7">migration</text><text x="396" y="484" font-size="17" font-weight="600" fill="#34D399" text-anchor="end">terminé</text><text x="78" y="552" font-size="16" font-weight="700" fill="#71717A">OUTIL-IA</text><circle cx="82" cy="590" r="7" fill="#FBBF24"/><text x="100" y="596" font-size="19" font-weight="400" fill="#E4E4E7">résumé PDF</text><text x="396" y="596" font-size="17" font-weight="600" fill="#FBBF24" text-anchor="end">autorisation</text><text x="78" y="806" font-size="17" font-weight="400" fill="#A1A1AA">⌃⌥J  suivant à traiter</text><rect x="422" y="112" width="817" height="62" fill="#18181B"/><text x="446" y="151" font-size="21" font-weight="700" fill="#F4F4F5">page d’accueil</text><text x="612" y="151" font-size="17" font-weight="400" fill="#A1A1AA">site-web · main</text><rect x="1018" y="124" width="202" height="40" rx="8" fill="none" stroke="#52525B" stroke-width="1.5"/><text x="1119" y="150" font-size="17" font-weight="400" fill="#D4D4D8" text-anchor="middle">Ouvrir dans VS Code</text><rect x="442" y="192" width="776" height="92" rx="12" fill="#2A1D06" stroke="#B45309" stroke-width="1.5"/><circle cx="468" cy="222" r="7" fill="#FBBF24"/><text x="486" y="228" font-size="18" font-weight="700" fill="#FBBF24">Claude pose une question</text><text x="468" y="264" font-size="19" font-weight="400" fill="#FDE68A">Garder l'ancienne bannière sur la nouvelle page d'accueil ?</text><text x="446" y="340" font-size="19" font-weight="400" fill="#F4F4F5" class="mono" xml:space="preserve">&gt; Refais la page d’accueil avec le nouveau design</text><text x="446" y="380" font-size="19" font-weight="400" fill="#A1A1AA" class="mono" xml:space="preserve">● Je lis le design system et la page actuelle.</text><text x="446" y="420" font-size="19" font-weight="400" fill="#A1A1AA" class="mono" xml:space="preserve">● 3 fichiers modifiés : index, Hero, styles</text><text x="446" y="460" font-size="19" font-weight="400" fill="#FBBF24" class="mono" xml:space="preserve">● Garder l’ancienne bannière ?</text><text x="446" y="500" font-size="19" font-weight="400" fill="#E4E4E7" class="mono" xml:space="preserve">  1. Oui, en haut de page</text><text x="446" y="540" font-size="19" font-weight="400" fill="#E4E4E7" class="mono" xml:space="preserve">  2. Non, la remplacer</text><text x="446" y="580" font-size="19" font-weight="400" fill="#E4E4E7" class="mono" xml:space="preserve">  3. La déplacer en bas</text><rect x="446" y="602" width="11" height="24" rx="2" fill="#D4D4D8" stroke="none" stroke-width="2"/></g>
<g id="telephone"><rect x="1272" y="150" width="280" height="600" rx="42" fill="#27272A" stroke="none" stroke-width="2"/><rect x="1284" y="162" width="256" height="576" rx="32" fill="#09090B" stroke="none" stroke-width="2"/><rect x="1374" y="176" width="76" height="10" rx="5" fill="#27272A" stroke="none" stroke-width="2"/><text x="1304" y="238" font-size="20" font-weight="700" fill="#F4F4F5">Terminaux</text><rect x="1296" y="258" width="232" height="48" rx="10" fill="#18181B" stroke="none" stroke-width="2"/><circle cx="1316" cy="282" r="7" fill="#FBBF24"/><text x="1334" y="289" font-size="18" font-weight="400" fill="#E4E4E7">page d’accueil</text><rect x="1296" y="316" width="232" height="48" rx="10" fill="#18181B" stroke="none" stroke-width="2"/><circle cx="1316" cy="340" r="7" fill="#818CF8"/><text x="1334" y="347" font-size="18" font-weight="400" fill="#E4E4E7">tests API</text><rect x="1296" y="374" width="232" height="48" rx="10" fill="#18181B" stroke="none" stroke-width="2"/><circle cx="1316" cy="398" r="7" fill="#34D399"/><text x="1334" y="405" font-size="18" font-weight="400" fill="#E4E4E7">migration</text><rect x="1296" y="432" width="232" height="48" rx="10" fill="#18181B" stroke="none" stroke-width="2"/><circle cx="1316" cy="456" r="7" fill="#FBBF24"/><text x="1334" y="463" font-size="18" font-weight="400" fill="#E4E4E7">résumé PDF</text><rect x="1298" y="672" width="42" height="40" rx="8" fill="#27272A" stroke="none" stroke-width="2"/><text x="1319" y="698" font-size="15" font-weight="400" fill="#D4D4D8" text-anchor="middle">Ctrl</text><rect x="1345" y="672" width="42" height="40" rx="8" fill="#27272A" stroke="none" stroke-width="2"/><text x="1366" y="698" font-size="15" font-weight="400" fill="#D4D4D8" text-anchor="middle">Esc</text><rect x="1392" y="672" width="42" height="40" rx="8" fill="#27272A" stroke="none" stroke-width="2"/><text x="1413" y="698" font-size="15" font-weight="400" fill="#D4D4D8" text-anchor="middle">Tab</text><rect x="1439" y="672" width="42" height="40" rx="8" fill="#27272A" stroke="none" stroke-width="2"/><text x="1460" y="698" font-size="15" font-weight="400" fill="#D4D4D8" text-anchor="middle">↑</text><rect x="1486" y="672" width="42" height="40" rx="8" fill="#27272A" stroke="none" stroke-width="2"/><text x="1507" y="698" font-size="15" font-weight="400" fill="#D4D4D8" text-anchor="middle">↓</text><text x="1412" y="790" font-size="18" font-weight="400" fill="#52525B" text-anchor="middle">la même liste</text><text x="1412" y="814" font-size="18" font-weight="400" fill="#52525B" text-anchor="middle">sur le téléphone</text></g>
