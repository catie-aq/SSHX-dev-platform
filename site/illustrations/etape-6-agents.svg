<title id="titre">Étape 6 : travailler avec l’agent</title>
<desc id="desc">SSHX Platform liste tous les terminaux avec l’état de leur agent ; Claude pose une question dans le terminal ouvert ; la même liste est disponible sur téléphone.</desc>
