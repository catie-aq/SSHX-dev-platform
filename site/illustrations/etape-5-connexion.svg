<title id="titre">Étape 5 : se connecter, recevoir ses machines</title>
<desc id="desc">L'utilisatrice se connecte avec son compte Microsoft et choisit une phrase secrète ; l'administrateur lui partage ses machines, dont la clé est chiffrée pour elle.</desc>
