<title id="titre">Étape 7 : montrer l’avancée</title>
<desc id="desc">L'application en cours s'ouvre à l'adresse privée de la machine pour les collègues ; un lien SSHX permet de travailler à deux ; rien n'est publié sur Internet.</desc>
