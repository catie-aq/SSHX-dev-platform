<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="titre desc">
<title id="titre">La sécurité en couches</title>
<desc id="desc">Matériel, réseau privé, identité, isolation, droits et chiffrement de bout en bout des terminaux ; ce que voient les serveurs et ce que décide l'administrateur.</desc>
<style>text{font-family:Inter,'Inter Variable',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.mono{font-family:'Fira Code','JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace}</style>
<defs></defs>
<rect id="fond" width="1600" height="900" fill="#FFFFFF"/>
<g id="materiel"><rect x="60" y="70" width="840" height="780" rx="30" fill="#FAFAFA" stroke="#A1A1AA" stroke-width="2"/><text x="90" y="114" font-size="21" font-weight="700" fill="#3F3F46">Votre matériel · Incus</text></g>
<g id="reseau"><rect x="100" y="140" width="760" height="680" rx="30" fill="#F8FAFC" stroke="#64748B" stroke-width="2" stroke-dasharray="10 8"/><text x="130" y="184" font-size="21" font-weight="700" fill="#64748B">Réseau privé · Tailscale</text></g>
<g id="identite"><rect x="140" y="210" width="680" height="580" rx="30" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="170" y="254" font-size="21" font-weight="700" fill="#0369A1">Identité · Microsoft Entra ID</text></g>
<g id="isolation"><rect x="180" y="280" width="600" height="480" rx="30" fill="#E8F3EE" stroke="#2D7A5F" stroke-width="2"/><text x="210" y="324" font-size="21" font-weight="700" fill="#2D7A5F">Une micro-VM par personne et par projet</text></g>
<g id="droits"><rect x="220" y="350" width="520" height="380" rx="30" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/><text x="250" y="394" font-size="21" font-weight="700" fill="#4F46E5">Droits : accès Git, secrets chiffrés</text></g>
<g id="chiffrement"><rect x="260" y="420" width="440" height="270" rx="22" fill="#FCE7F3" stroke="#BE185D" stroke-width="2.5"/><g transform="translate(450 444) scale(1.7)" stroke="#BE185D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 15 V10 a7 7 0 0 1 14 0 V15" fill="none"/><rect x="3" y="15" width="26" height="20" rx="4" fill="#FFFFFF"/><circle cx="16" cy="25" r="2" fill="#BE185D" stroke="none"/></g><text x="480" y="552" font-size="26" font-weight="800" fill="#BE185D" text-anchor="middle">Terminaux chiffrés</text><text x="480" y="586" font-size="26" font-weight="800" fill="#BE185D" text-anchor="middle">de bout en bout</text><text x="480" y="630" font-size="18" font-weight="400" fill="#52525B" text-anchor="middle">code, sorties,</text><text x="480" y="654" font-size="18" font-weight="400" fill="#52525B" text-anchor="middle">questions des agents</text></g>
<g id="visible"><rect x="960" y="70" width="580" height="380" rx="20" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="2"/><text x="990" y="118" font-size="24" font-weight="800" fill="#18181B">Ce que voient les serveurs</text><text x="990" y="164" font-size="16" font-weight="700" fill="#A1A1AA">VISIBLE</text><circle cx="998" cy="196" r="5" fill="#A1A1AA"/><text x="1014" y="202" font-size="20" font-weight="400" fill="#18181B">état des agents, horodatages</text><circle cx="998" cy="232" r="5" fill="#A1A1AA"/><text x="1014" y="238" font-size="20" font-weight="400" fill="#18181B">noms des machines et des sessions</text><text x="990" y="290" font-size="16" font-weight="700" fill="#BE185D">JAMAIS EN CLAIR</text><path d="M992 310 l10.8 10.8 M1002.8 310 l-10.8 10.8" fill="none" stroke="#BE185D" stroke-width="3.5" stroke-linecap="round"/><text x="1018" y="324" font-size="20" font-weight="400" fill="#18181B">contenu des terminaux</text><path d="M992 350 l10.8 10.8 M1002.8 350 l-10.8 10.8" fill="none" stroke="#BE185D" stroke-width="3.5" stroke-linecap="round"/><text x="1018" y="364" font-size="20" font-weight="400" fill="#18181B">dossiers, branches, noms de terminaux</text><path d="M992 390 l10.8 10.8 M1002.8 390 l-10.8 10.8" fill="none" stroke="#BE185D" stroke-width="3.5" stroke-linecap="round"/><text x="1018" y="404" font-size="20" font-weight="400" fill="#18181B">questions et réponses des agents</text></g>
<g id="administrateur"><rect x="960" y="480" width="580" height="370" rx="20" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="2"/><text x="990" y="528" font-size="24" font-weight="800" fill="#18181B">Ce que décide l'administrateur</text><path d="M990 562 l5.1 5.1 l10.2 -11.049999999999999" fill="none" stroke="#2D7A5F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="1018" y="574" font-size="20" font-weight="400" fill="#18181B">qui reçoit quelle machine</text><path d="M990 606 l5.1 5.1 l10.2 -11.049999999999999" fill="none" stroke="#2D7A5F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="1018" y="618" font-size="20" font-weight="400" fill="#18181B">les clés SSH installées</text><path d="M990 650 l5.1 5.1 l10.2 -11.049999999999999" fill="none" stroke="#2D7A5F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="1018" y="662" font-size="20" font-weight="400" fill="#18181B">l'accès Git selon le niveau</text><path d="M990 694 l5.1 5.1 l10.2 -11.049999999999999" fill="none" stroke="#2D7A5F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="1018" y="706" font-size="20" font-weight="400" fill="#18181B">les secrets injectés</text><path d="M990 738 l5.1 5.1 l10.2 -11.049999999999999" fill="none" stroke="#2D7A5F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="1018" y="750" font-size="20" font-weight="400" fill="#18181B">CPU, mémoire, arrêt automatique</text><path d="M990 782 l5.1 5.1 l10.2 -11.049999999999999" fill="none" stroke="#2D7A5F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="1018" y="794" font-size="20" font-weight="400" fill="#18181B">l'agent IA et son fournisseur</text></g>
</svg>
