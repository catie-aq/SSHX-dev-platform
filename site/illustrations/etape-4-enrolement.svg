<g id="terminal"><path d="M70 286 V256 a16 16 0 0 1 16 -16 H754 a16 16 0 0 1 16 16 V286 Z" fill="#27272A"/><path d="M70 286 H770 V744 a16 16 0 0 1 -16 16 H86 a16 16 0 0 1 -16 -16 Z" fill="#18181B"/><circle cx="96" cy="263" r="6" fill="#52525B"/><circle cx="116" cy="263" r="6" fill="#52525B"/><circle cx="136" cy="263" r="6" fill="#52525B"/><text x="170" y="269" font-size="17" font-weight="400" fill="#A1A1AA" class="mono" xml:space="preserve">site-web — terminal</text><text x="100" y="334" font-size="20" font-weight="400" fill="#F4F4F5" class="mono" xml:space="preserve">$ sshx platform enroll \</text><text x="100" y="378" font-size="20" font-weight="400" fill="#F4F4F5" class="mono" xml:space="preserve">    https://plateforme.votre-tailnet.ts.net \</text><text x="100" y="422" font-size="20" font-weight="400" fill="#F4F4F5" class="mono" xml:space="preserve">    smt_7Hq…  &amp;&amp; sshx</text><path d="M102 500 l4.800000000000001 4.800000000000001 l9.600000000000001 -10.4" fill="none" stroke="#34D399" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="132" y="510" font-size="20" font-weight="400" fill="#34D399" class="mono" xml:space="preserve">plateforme enregistrée</text><path d="M102 544 l4.800000000000001 4.800000000000001 l9.600000000000001 -10.4" fill="none" stroke="#34D399" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="132" y="554" font-size="20" font-weight="400" fill="#34D399" class="mono" xml:space="preserve">hooks Claude Code installés</text><path d="M102 588 l4.800000000000001 4.800000000000001 l9.600000000000001 -10.4" fill="none" stroke="#34D399" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="132" y="598" font-size="20" font-weight="400" fill="#34D399" class="mono" xml:space="preserve">session en ligne</text><rect x="100" y="638" width="12" height="24" rx="2" fill="#D4D4D8" stroke="none" stroke-width="2"/></g>
<g id="sshx"><path d="M776 500 H954" fill="none" stroke="#BE185D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pointe-BE185D)"/><text x="865" y="452" font-size="22" font-weight="800" fill="#BE185D" text-anchor="middle">SSHX</text><circle cx="865" cy="500" r="24" fill="#FFFFFF" stroke="#BE185D" stroke-width="3"/><g transform="translate(852 481) scale(0.8)" stroke="#BE185D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 15 V10 a7 7 0 0 1 14 0 V15" fill="none"/><rect x="3" y="15" width="26" height="20" rx="4" fill="#FFFFFF"/><circle cx="16" cy="25" r="2" fill="#BE185D" stroke="none"/></g><text x="865" y="556" font-size="17" font-weight="400" fill="#52525B" text-anchor="middle">chiffré de bout en bout</text></g>
