<title id="titre">Étape 4 : relier à SSHX Platform</title>
<desc id="desc">L'administrateur lance une commande dans la micro-VM ; la machine apparaît dans SSHX Platform, reliée par SSHX et chiffrée de bout en bout.</desc>
<style>text{font-family:Inter,'Inter Variable',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.mono{font-family:'Fira Code','JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace}</style>
<defs><marker id="pointe-BE185D" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#BE185D"/></marker></defs>
<rect id="fond" width="1600" height="900" fill="#FFFFFF"/>
