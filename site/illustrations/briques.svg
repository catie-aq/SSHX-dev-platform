<g id="sshx"><path d="M570 310 V82 a22 22 0 0 1 22 -22 H1008 a22 22 0 0 1 22 22 V310 Z" fill="#FCE7F3"/><rect x="570" y="60" width="460" height="690" rx="22" fill="none" stroke="#BE185D" stroke-width="3"/><text x="606" y="140" font-size="52" font-weight="800" fill="#BE185D">Ouvrir</text><text x="606" y="196" font-size="30" font-weight="700" fill="#18181B">SSHX</text><text x="606" y="236" font-size="21" font-weight="400" fill="#52525B">une machine dans le navigateur,</text><text x="606" y="266" font-size="21" font-weight="400" fill="#52525B">chiffrée de bout en bout</text><text x="606" y="712" font-size="21" font-weight="700" fill="#BE185D">Pour une machine et ses invités</text><path d="M620 402 V368 a18 18 0 0 1 18 -18 H962 a18 18 0 0 1 18 18 V402 Z" fill="#F4F4F5"/><path d="M620 402 H980 V632 a18 18 0 0 1 -18 18 H638 a18 18 0 0 1 -18 -18 Z" fill="#18181B"/><circle cx="648" cy="376" r="7" fill="#D4D4D8"/><circle cx="670" cy="376" r="7" fill="#D4D4D8"/><circle cx="692" cy="376" r="7" fill="#D4D4D8"/><rect x="620" y="350" width="360" height="300" rx="18" fill="none" stroke="#D4D4D8" stroke-width="2"/><text x="644" y="450" font-size="20" font-weight="400" fill="#F4F4F5" class="mono" xml:space="preserve">$ claude</text><text x="644" y="488" font-size="18" font-weight="400" fill="#A1A1AA" class="mono" xml:space="preserve">● Je lis le projet…</text><text x="644" y="522" font-size="18" font-weight="400" fill="#34D399" class="mono" xml:space="preserve">● 3 fichiers modifiés</text><rect x="644" y="546" width="12" height="22" rx="2" fill="#D4D4D8" stroke="none" stroke-width="2"/><circle cx="938" cy="604" r="26" fill="#FFFFFF" stroke="#BE185D" stroke-width="3"/><g transform="translate(924 586) scale(0.85)" stroke="#BE185D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 15 V10 a7 7 0 0 1 14 0 V15" fill="none"/><rect x="3" y="15" width="26" height="20" rx="4" fill="#FFFFFF"/><circle cx="16" cy="25" r="2" fill="#BE185D" stroke="none"/></g></g>
<g id="platform"><path d="M1080 310 V82 a22 22 0 0 1 22 -22 H1518 a22 22 0 0 1 22 22 V310 Z" fill="#EEF2FF"/><rect x="1080" y="60" width="460" height="690" rx="22" fill="none" stroke="#4F46E5" stroke-width="3"/><text x="1116" y="140" font-size="52" font-weight="800" fill="#4F46E5">Réunir</text><text x="1116" y="196" font-size="30" font-weight="700" fill="#18181B">SSHX Platform</text><text x="1116" y="236" font-size="21" font-weight="400" fill="#52525B">toutes les machines et tous</text><text x="1116" y="266" font-size="21" font-weight="400" fill="#52525B">les agents d’une personne</text><text x="1116" y="712" font-size="21" font-weight="700" fill="#4F46E5">Pour chaque utilisateur</text><rect x="1130" y="350" width="360" height="300" rx="16" fill="#18181B" stroke="none" stroke-width="2"/><circle cx="1160" cy="406" r="7" fill="#818CF8"/><text x="1178" y="412" font-size="19" font-weight="400" fill="#E4E4E7">site-web</text><text x="1466" y="412" font-size="17" font-weight="600" fill="#818CF8" text-anchor="end">au travail</text><rect x="1142" y="446" width="336" height="50" rx="8" fill="#27272A" stroke="none" stroke-width="2"/><circle cx="1160" cy="470" r="7" fill="#FBBF24"/><text x="1178" y="476" font-size="19" font-weight="600" fill="#F4F4F5">app-interne</text><text x="1466" y="476" font-size="17" font-weight="600" fill="#FBBF24" text-anchor="end">question</text><circle cx="1160" cy="534" r="7" fill="#34D399"/><text x="1178" y="540" font-size="19" font-weight="400" fill="#E4E4E7">outil-ia</text><text x="1466" y="540" font-size="17" font-weight="600" fill="#34D399" text-anchor="end">terminé</text><circle cx="1160" cy="598" r="7" fill="#52525B"/><text x="1178" y="604" font-size="19" font-weight="400" fill="#E4E4E7">site-web · 2</text></g>
