<g id="plati"><path d="M60 310 V82 a22 22 0 0 1 22 -22 H498 a22 22 0 0 1 22 22 V310 Z" fill="#E8F3EE"/><rect x="60" y="60" width="460" height="690" rx="22" fill="none" stroke="#2D7A5F" stroke-width="3"/><text x="96" y="140" font-size="52" font-weight="800" fill="#2D7A5F">Créer</text><text x="96" y="196" font-size="30" font-weight="700" fill="#18181B">Plati</text><text x="96" y="236" font-size="21" font-weight="400" fill="#52525B">le micro-cloud : crée et gère</text><text x="96" y="266" font-size="21" font-weight="400" fill="#52525B">les machines de toute l’équipe</text><text x="96" y="712" font-size="21" font-weight="700" fill="#2D7A5F">Pour les administrateurs</text><rect x="110" y="350" width="360" height="300" rx="16" fill="#F4F4F5" stroke="#D4D4D8" stroke-width="2"/><g transform="translate(130 368) scale(0.8)" fill="none" stroke="#52525B" stroke-width="3"><rect x="2" y="2" width="36" height="11" rx="3"/><circle cx="30" cy="7.5" r="1.6" fill="#52525B"/><rect x="2" y="16" width="36" height="11" rx="3"/><circle cx="30" cy="21.5" r="1.6" fill="#52525B"/><rect x="2" y="30" width="36" height="11" rx="3"/><circle cx="30" cy="35.5" r="1.6" fill="#52525B"/></g><text x="174" y="396" font-size="18" font-weight="400" fill="#52525B">serveur Incus</text><rect x="130" y="426" width="152" height="92" rx="12" fill="#FFFFFF" stroke="#2D7A5F" stroke-width="2"/><rect x="144" y="442" width="70" height="12" rx="6" fill="#18181B" stroke="none" stroke-width="2"/><rect x="144" y="468" width="54" height="20" rx="10" fill="#FEF3C7" stroke="none" stroke-width="2"/><rect x="204" y="468" width="40" height="20" rx="10" fill="#FCE7F3" stroke="none" stroke-width="2"/><rect x="144" y="494" width="60" height="10" rx="5" fill="#D4D4D8" stroke="none" stroke-width="2"/><rect x="298" y="426" width="152" height="92" rx="12" fill="#FFFFFF" stroke="#2D7A5F" stroke-width="2"/><rect x="312" y="442" width="70" height="12" rx="6" fill="#18181B" stroke="none" stroke-width="2"/><rect x="312" y="468" width="54