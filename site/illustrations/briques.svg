<title id="titre">Trois briques</title>
<desc id="desc">Plati crée les machines, SSHX ouvre une machine dans le navigateur, SSHX Platform réunit toutes les machines et tous les agents d’une personne. Fondations : Tailscale, Entra ID, Incus, Claude Code.</desc>
<style>text{font-family:Inter,'Inter Variable',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.mono{font-family:'Fira Code','JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace}</style>
